apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-dashboard
  labels:
    app: energy-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: energy-dashboard
  template:
    metadata:
      labels:
        app: energy-dashboard
    spec:
      containers:
        - name: energy-dashboard
          image: energy-dashboard:local
          ports:
            - containerPort: 5050
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5050
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5050
